name: macOS SOCKS5 build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-socks5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out Proton VPN
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out public submodules
        run: |
          git config submodule.external/protoncore.url https://github.com/ProtonMail/protoncore_ios.git
          git config submodule.external/wireguard-apple.url https://github.com/ProtonVPN/wireguard-apple.git
          git submodule update --init --depth 1 \
            external/protoncore \
            external/wireguard-apple

      - name: Apply WireGuard SOCKS5 patch
        run: |
          git -C external/wireguard-apple apply --check --unidiff-zero "$GITHUB_WORKSPACE/.github/patches/wireguard-socks5.patch"
          git -C external/wireguard-apple apply --unidiff-zero "$GITHUB_WORKSPACE/.github/patches/wireguard-socks5.patch"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
          cache-dependency-path: external/wireguard-apple/Sources/WireGuardKitGo/go.sum

      - name: Test userspace WireGuard and SOCKS5
        working-directory: external/wireguard-apple/Sources/WireGuardKitGo
        run: |
          go test ./...
          go test -race ./...

      - name: Prepare public build constants
        run: |
          cp apps/macos/ProtonVPN/ObfuscatedConstants.example.swift apps/macos/ProtonVPN/ObfuscatedConstants.swift
          cp apps/macos/ProtonVPN/ObfuscatedConstants.example.swift libraries/Features/Settings/Sources/SettingsShared/ObfuscatedConstants.swift
          cp apps/macos/ProtonVPN/ObfuscatedConstants.example.swift libraries/Core/LegacyCommon/Sources/LegacyCommon/ObfuscatedConstants.swift
          cp apps/macos/ProtonVPN/ObfuscatedConstants.example.swift libraries/Features/Home/Sources/HomeShared/ObfuscatedConstants.swift

      - name: Resolve Swift packages
        run: |
          git config --global url.https://github.com/ProtonMail/apple-fusion.git.insteadOf git@gitlab.protontech.ch:tpe/apple-fusion.git
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ProtonVPN-SOCKS5.xcworkspace \
            -scheme ProtonVPN-macOS

      - name: Build Proton VPN for macOS
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ProtonVPN-SOCKS5.xcworkspace \
            -scheme ProtonVPN-macOS \
            -skipMacroValidation \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/ProtonVPNDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Build and embed userspace SOCKS5 helper
        run: |
          set -euo pipefail
          WG_LIBRARY_DIR="$RUNNER_TEMP/ProtonVPNDerivedData/Build/Products/Debug"
          HELPER_BUILD_DIR="$RUNNER_TEMP/ProtonSocksHelperBuild"
          APP_PATH="$RUNNER_TEMP/ProtonVPNDerivedData/Build/Products/Debug/ProtonVPN.app"

          test -f "$WG_LIBRARY_DIR/libwg-go.a"
          swift build \
            --package-path libraries/Core/ProtonSocks \
            --product ProtonSocksHelper \
            --configuration release \
            --scratch-path "$HELPER_BUILD_DIR" \
            -Xlinker -L"$WG_LIBRARY_DIR"

          HELPER_BIN_DIR="$(swift build \
            --package-path libraries/Core/ProtonSocks \
            --configuration release \
            --scratch-path "$HELPER_BUILD_DIR" \
            --show-bin-path)"
          mkdir -p "$APP_PATH/Contents/Helpers"
          ditto \
            "$HELPER_BIN_DIR/ProtonSocksHelper" \
            "$APP_PATH/Contents/Helpers/ProtonSocksHelper"
          test -x "$APP_PATH/Contents/Helpers/ProtonSocksHelper"

          HELPER_RESPONSE="$(printf '%s\n' \
            '{"id":"01A000AF-6F71-7FC3-9AF2-C5416122C122","command":"ping"}' \
            | "$APP_PATH/Contents/Helpers/ProtonSocksHelper")"
          printf '%s\n' "$HELPER_RESPONSE" | grep -q '"success":true'

      - name: Verify Go runtime process isolation
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ProtonVPNDerivedData/Build/Products/Debug/ProtonVPN.app"
          MAIN_IMAGE="$APP_PATH/Contents/MacOS/ProtonVPN"
          HELPER_IMAGE="$APP_PATH/Contents/Helpers/ProtonSocksHelper"
          if test -f "$APP_PATH/Contents/MacOS/ProtonVPN.debug.dylib"; then
            MAIN_IMAGE="$APP_PATH/Contents/MacOS/ProtonVPN.debug.dylib"
          fi

          test "$(nm "$MAIN_IMAGE" | grep -c '_go:buildinfo$')" -eq 1
          test "$(nm "$MAIN_IMAGE" | grep -c '_runtime.raise_trampoline.abi0$')" -eq 1
          if grep -aFq 'golang.zx2c4.com/wireguard/apple' "$MAIN_IMAGE"; then
            echo 'WireGuard Go is still linked into the main app process' >&2
            exit 1
          fi

          test "$(nm "$HELPER_IMAGE" | grep -c '_go:buildinfo$')" -eq 1
          test "$(nm "$HELPER_IMAGE" | grep -c '_runtime.raise_trampoline.abi0$')" -eq 1
          grep -aFq 'golang.zx2c4.com/wireguard/apple' "$HELPER_IMAGE"
          if otool -L "$HELPER_IMAGE" | grep -Fq 'NetworkExtension.framework'; then
            echo 'The SOCKS5 helper still links NetworkExtension.framework' >&2
            exit 1
          fi

      - name: Ad-hoc sign app for local execution
        run: |
          codesign --force --sign - --timestamp=none \
            "$RUNNER_TEMP/ProtonVPNDerivedData/Build/Products/Debug/ProtonVPN.app/Contents/Helpers/ProtonSocksHelper"
          codesign --force --deep --sign - --timestamp=none \
            "$RUNNER_TEMP/ProtonVPNDerivedData/Build/Products/Debug/ProtonVPN.app"
          codesign --verify --deep --strict --verbose=4 \
            "$RUNNER_TEMP/ProtonVPNDerivedData/Build/Products/Debug/ProtonVPN.app"

      - name: Package ad-hoc signed disk image
        run: |
          mkdir -p "$RUNNER_TEMP/ProtonVPN-SOCKS5-dmg"
          ditto \
            "$RUNNER_TEMP/ProtonVPNDerivedData/Build/Products/Debug/ProtonVPN.app" \
            "$RUNNER_TEMP/ProtonVPN-SOCKS5-dmg/ProtonVPN.app"
          ln -s /Applications "$RUNNER_TEMP/ProtonVPN-SOCKS5-dmg/Applications"
          hdiutil create \
            -volname "ProtonVPN SOCKS5" \
            -srcfolder "$RUNNER_TEMP/ProtonVPN-SOCKS5-dmg" \
            -format UDZO \
            -ov \
            "$RUNNER_TEMP/ProtonVPN-SOCKS5.dmg"
          hdiutil verify "$RUNNER_TEMP/ProtonVPN-SOCKS5.dmg"
          mkdir -p "$RUNNER_TEMP/ProtonVPN-SOCKS5-mount"
          hdiutil attach \
            "$RUNNER_TEMP/ProtonVPN-SOCKS5.dmg" \
            -mountpoint "$RUNNER_TEMP/ProtonVPN-SOCKS5-mount" \
            -nobrowse \
            -readonly
          codesign --verify --deep --strict --verbose=4 \
            "$RUNNER_TEMP/ProtonVPN-SOCKS5-mount/ProtonVPN.app"
          test -L "$RUNNER_TEMP/ProtonVPN-SOCKS5-mount/Applications"
          test "$(readlink "$RUNNER_TEMP/ProtonVPN-SOCKS5-mount/Applications")" = "/Applications"
          hdiutil detach "$RUNNER_TEMP/ProtonVPN-SOCKS5-mount"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ProtonVPN-SOCKS5-macOS
          path: ${{ runner.temp }}/ProtonVPN-SOCKS5.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
